<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Share Note</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="js/api.service.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/share.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="editor-container">
      <div class="header">
        <h1>Share Note</h1>
        <button class="btn-secondary" onclick="window.location='notes.html'">Back to Notes</button>
      </div>

      <form id="shareForm">
        <div class="form-group">
          <label for="recipient">Recipient Email</label>
          <input type="email" id="recipient" placeholder="Enter recipient email" required>
        </div>
        <div class="form-group">
          <label for="permission">Permission Level</label>
          <select id="permission" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px;">
            <option value="read">Read Only</option>
            <option value="write">Read & Write</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Share Note</button>
      </form>

      <div id="error" class="error-message"></div>
      <div id="success" class="success-message" style="display:none;">Note shared successfully!</div>

      <div class="shared-section">
        <h2>Already shared with</h2>
        <ul id="sharedList" class="notes-list"></ul>
      </div>
    </div>
  </div>
</body>
</html>
