<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Note - Secure Notes</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  
  <!-- Core Scripts -->
  <script src="js/failover.service.js" defer></script>
  <script src="js/api.service.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/global-actions.js" defer></script>
  <script src="js/auth.js" defer></script>
  
  <!-- Feature Scripts -->
  <script src="js/share.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="editor-container">
      <!-- Header -->
      <div class="header">
        <h1>🔗 Share Note</h1>
        <button class="btn-secondary" onclick="window.location='notes.html'">
          ← Back to Notes
        </button>
      </div>

      <!-- Note Info Card -->
      <div style="
        background: var(--gray-50);
        border: 2px solid var(--gray-200);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
      ">
        <div style="display: flex; align-items: start; gap: 12px;">
          <span style="font-size: 32px;">📝</span>
          <div style="flex: 1;">
            <h2 id="noteTitle" style="
              margin: 0 0 8px 0;
              color: var(--gray-900);
              font-size: 20px;
              font-weight: 600;
            ">
              Loading...
            </h2>
            <p id="notePreview" style="
              margin: 0;
              color: var(--gray-600);
              font-size: 14px;
              line-height: 1.5;
            ">
              Loading note information...
            </p>
          </div>
        </div>
      </div>

      <!-- Share Form -->
      <form id="shareForm" style="margin-bottom: 40px;">
        <h3 style="
          margin: 0 0 20px 0;
          color: var(--gray-800);
          font-size: 18px;
          font-weight: 600;
        ">
          Share with someone
        </h3>

        <div class="form-group">
          <label for="recipient">Recipient Email</label>
          <input 
            type="email" 
            id="recipient" 
            placeholder="colleague@example.com" 
            required
            autocomplete="email"
            aria-label="Recipient email address"
          >
          <small style="display: block; margin-top: 6px; color: var(--gray-600);">
            Enter the email address of the person you want to share with
          </small>
        </div>

        <div class="form-group">
          <label for="permission">Permission Level</label>
          <select 
            id="permission" 
            style="
              width: 100%;
              padding: 14px 16px;
              border: 2px solid var(--gray-200);
              border-radius: 12px;
              font-size: 15px;
              font-family: inherit;
              background: white;
              cursor: pointer;
              transition: var(--transition);
            "
            aria-label="Permission level"
          >
            <option value="read">👁️ Read Only - Can view the note</option>
            <option value="write">✏️ Read & Write - Can view and edit</option>
          </select>
          <small style="display: block; margin-top: 6px; color: var(--gray-600);">
            Choose what the recipient can do with this note
          </small>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">
          🔗 Share Note
        </button>
      </form>

      <!-- Messages -->
      <div id="error" class="error-message" style="display: none;"></div>
      <div id="success" class="success-message" style="display: none;">
        ✓ Note shared successfully!
      </div>

      <!-- Shared With Section -->
      <div class="shared-section" style="
        margin-top: 40px;
        padding-top: 30px;
        border-top: 2px solid var(--gray-200);
      ">
        <h2 style="
          color: var(--gray-800);
          font-size: 20px;
          margin-bottom: 20px;
          font-weight: 600;
        ">
          👥 Already shared with
        </h2>
        <ul id="sharedList" class="notes-list">
          <li class="loading" style="text-align: center; padding: 20px; color: var(--gray-600);">
            Loading shared users...
          </li>
        </ul>
      </div>
    </div>
  </div>

  <style>
    /* Select hover effect */
    select:hover {
      border-color: var(--primary);
    }

    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    /* Loading animation */
    .loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* Permission badges in list */
    .permission-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .permission-badge.write {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }

    .permission-badge.read {
      background: rgba(156, 163, 175, 0.1);
      color: var(--gray-600);
    }
  </style>
</body>
</html>
