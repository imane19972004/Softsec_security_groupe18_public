<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Notes</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="js/api.service.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/notes.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Your Notes</h1>
      <div class="header-actions">
        <button class="btn-primary" onclick="window.location='edit.html'">+ New Note</button>
        <button class="btn-secondary" onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="error" class="error-message"></div>
    
    <div id="loadingSpinner" class="loading" style="display:none;">Loading notes...</div>
    
    <div id="notesContainer">
      <ul id="notesList" class="notes-list"></ul>
    </div>
  </div>
</body>
</html>
