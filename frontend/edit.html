<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Note - Secure Notes</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <!-- Core Scripts -->
  <script src="js/failover.service.js" defer></script>
  <script src="js/api.service.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/global-actions.js" defer></script>
  <script src="js/auth.js" defer></script>
  
  <!-- Feature Scripts -->
  <script src="js/notes.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="editor-container">
      <!-- Header -->
      <div class="header">
        <h1 id="pageTitle">📝 Create New Note</h1>
        <button class="btn-secondary" onclick="editor.confirmLeave()">
          ← Back to Notes
        </button>
      </div>

      <!-- Lock Status -->
      <div id="lockStatus" class="subtitle"></div>
      
      <!-- Lock/Unlock Buttons -->
      <div class="form-actions" style="margin-bottom: 20px;">
        <button id="lockBtn" class="btn-secondary" style="display:none;">
          🔒 Lock Note
        </button>
        <button id="unlockBtn" class="btn-secondary" style="display:none;">
          🔓 Unlock Note
        </button>
      </div>

      <!-- Note Form -->
      <form id="noteForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input 
            type="text" 
            id="title" 
            placeholder="Enter note title..." 
            maxlength="100"
            required
            aria-label="Note title"
          >
          <small id="titleCounter" style="display: block; margin-top: 4px; color: var(--gray-600);">
            0 / 100
          </small>
        </div>

        <!-- Toolbar -->
        <div class="editor-toolbar" style="display: flex; gap: 8px; margin-bottom: 8px;">
          <button type="button" onclick="insertText('**', '**')" class="btn-secondary" style="padding: 8px 12px;">
            <strong>B</strong>
          </button>
          <button type="button" onclick="insertText('*', '*')" class="btn-secondary" style="padding: 8px 12px;">
            <em>I</em>
          </button>
          <button type="button" onclick="insertText('`', '`')" class="btn-secondary" style="padding: 8px 12px;">
            Code
          </button>
          <button type="button" class="preview-btn btn-secondary" data-mode="edit" onclick="togglePreview('edit')" style="padding: 8px 12px; margin-left: auto;">
            ✏️ Edit
          </button>
          <button type="button" class="preview-btn btn-secondary" data-mode="preview" onclick="togglePreview('preview')" style="padding: 8px 12px;">
            👁️ Preview
          </button>
        </div>

        <div class="form-group">
          <label for="content">Content</label>
          <textarea 
            id="content" 
            placeholder="Write your note here..."
            required
            aria-label="Note content"
            style="min-height: 300px;"
          ></textarea>
          <small id="contentCounter" style="display: block; margin-top: 4px; color: var(--gray-600);">
            0 characters
          </small>
        </div>

        <!-- Preview Pane (hidden by default) -->
        <div id="previewPane" class="preview-pane" style="display: none; background: var(--gray-50); padding: 20px; border-radius: 8px; min-height: 300px; margin-bottom: 16px;"></div>

        <!-- Autosave Indicator -->
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
          <span id="autosaveDot" class="autosave-dot"></span>
          <span id="autosaveText" class="autosave-text">Ready to save</span>
        </div>

        <!-- Unsaved Warning -->
        <div id="unsavedWarning" class="unsaved-warning" style="color: var(--warning); display: none; margin-bottom: 16px;">
          ⚠️ You have unsaved changes
        </div>

        <!-- Action Buttons -->
        <div class="form-actions">
          <button type="submit" class="btn-primary">
            💾 Save Note
          </button>
          <button 
            type="button" 
            class="btn-danger" 
            id="deleteBtn" 
            style="display:none;" 
            onclick="deleteCurrentNote()"
          >
            🗑️ Delete Note
          </button>
        </div>
      </form>

      <!-- Messages -->
      <div id="error" class="error-message"></div>
      <div id="success" class="success-message" style="display:none;">
        ✓ Note saved successfully!
      </div>
    </div>
  </div>
</body>
</html>
