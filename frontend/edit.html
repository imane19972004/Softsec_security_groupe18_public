<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Note</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="js/api.service.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/notes.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="editor-container">
      <div class="header">
        <h1 id="pageTitle">Create New Note</h1>
        <button class="btn-secondary" onclick="window.location='notes.html'">Back to Notes</button>
      </div>

      <form id="noteForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="Note title" required>
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" placeholder="Write your note here..." required></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Note</button>
          <button type="button" class="btn-danger" id="deleteBtn" style="display:none;" onclick="deleteCurrentNote()">Delete</button>
        </div>
      </form>

      <div id="error" class="error-message"></div>
      <div id="success" class="success-message" style="display:none;">Note saved successfully!</div>
    </div>
  </div>
</body>
</html>
