<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Secure Notes</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  
  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  
  <!-- Core Scripts -->
  <script src="js/failover.service.js" defer></script>
  <script src="js/api.service.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/notifications.js" defer></script>
  <script src="js/global-actions.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="auth-container">
      <!-- Logo -->
      <div class="auth-logo">🔐</div>
      
      <!-- Title -->
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to access your secure notes</p>

      <!-- Login Form -->
      <form id="loginForm">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required
            autocomplete="email"
            autofocus
            aria-label="Email address"
          >
        </div>
        
        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="Enter your password" 
              required
              autocomplete="current-password"
              aria-label="Password"
            >
            <button 
              type="button" 
              class="password-toggle" 
              onclick="setupPasswordToggle()"
              aria-label="Toggle password visibility"
            >
              👁️
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>

      <!-- Error Message -->
      <div id="error" class="error-message"></div>
      
      <!-- Register Link -->
      <p class="auth-link">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <!-- Server Status Indicator -->
  <div class="server-status" id="serverStatus">
    <span class="server-status-dot" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</body>
</html>
